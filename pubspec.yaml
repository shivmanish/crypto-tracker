name: crypto_tracker
description: "Crypto Tracker — paginated coin markets, details, and favorites."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # functional error handling + DI
  dartz: ^0.10.1
  get_it: ^7.7.0

  # network
  dio: ^5.7.0
  internet_connection_checker_plus: ^2.5.2

  # local persistence
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  # web-only sqlite backend (wasm) so the coin/trending cache works in browser
  sqflite_common_ffi_web: ^0.4.5+1
  path: ^1.9.0

  # routing + i18n + ui
  auto_route: ^10.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.3

  build_runner: ^2.4.13
  auto_route_generator: ^10.2.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
