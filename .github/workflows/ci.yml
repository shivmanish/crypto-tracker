name: CI

on:
  # Direct pushes to main, and merges of a PR into main.
  push:
    branches: [main]
  # Every push to a branch that has an open PR targeting main.
  pull_request:
    branches: [main]
  # Allow running it manually from the Actions tab.
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test
